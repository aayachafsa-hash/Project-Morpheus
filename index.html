<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0c0b">
  <link rel="icon" href="data:,">
  <title>Morpheus / Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/ui/styles.css?shadow-progress">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main id="stage" aria-label="Player 1 shadow puzzle. Drag Aquafish to move. Tap R to rotate, press Z to adjust height, or Shift-drag to tilt. Keyboard movement uses W A S D, R and F for height, and Q and E for rotation."></main>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div>
      <h1>MORPHEUS</h1><p class="subtitle">PROTOTYPE</p>
      <a class="gallery-link" href="../shadowmatic-gallery/gallery.html" target="_blank" rel="noopener">Explore Shadowmatic meshes <span aria-hidden="true">↗</span></a>
    </div>
    <div class="actions">
      <button id="reset" title="Restore initial object positions and rotations"><span aria-hidden="true">↶</span> Reset</button>
      <button id="pause" aria-pressed="false"><span aria-hidden="true">Ⅱ</span> <span id="pause-label">Pause</span></button>
    </div>
  </header>
  <section class="study" aria-label="Target shadow and match">
    <h2>01 / AQUAFISH</h2>
    <div class="target-preview">
      <img id="target-reference" alt="Original Shadowmatic fish silhouette" hidden>
      <canvas id="target" role="img" aria-label="Target silhouette projected by Aquafish"></canvas>
    </div>
    <div class="match-row"><span>MATCH</span><strong id="match">—</strong></div>
    <div id="progress-dots" class="progress-dots" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <p id="match-status" class="match-status" role="status"></p>
    <button id="assist" class="solution-button" title="Available after 30 seconds or when you are close" disabled>Assist</button>
    <button id="show-solution" class="solution-button">Show solution</button>
  </section>
  <footer id="player-controls" aria-label="Player 1 controls">
    <span class="control-row">
      <span data-control="move"><kbd>Drag</kbd> Move</span>
      <span data-control="rotate">Tap <kbd>R</kbd> Rotate</span>
      <span data-control="height"><kbd>Z</kbd> Height</span>
    </span>
    <span class="extra control-row">
      <span data-control="depth"><kbd>Scroll</kbd> Depth</span>
      <span data-control="tilt"><kbd>Shift</kbd> + drag Tilt</span>
    </span>
    <span class="extra control-row">
      <span><kbd>W A S D</kbd> Move</span>
      <span><kbd>Q E</kbd> Turn <span id="rotation-axis">Y</span></span>
      <span><kbd>T</kbd> Axis</span>
    </span>
    <span class="extra control-row">
      <span>Hold <kbd>R</kbd> Raise</span>
      <span><kbd>F</kbd> Lower</span>
    </span>
  </footer>
  <button id="check" class="primary">Check Shadow <span aria-hidden="true">→</span></button>
  <div class="telemetry"><span id="performance">Measuring FPS…</span></div>
  <div id="error" role="alert" hidden></div>
  <script type="module">
    import('./src/main.js?shadow-progress').catch(error => {
      const notice = document.querySelector('#error');
      notice.hidden = false;
      notice.textContent = `Could not start: ${error.message}`;
      console.error(error);
    });
  </script>
</body>
</html>
