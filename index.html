<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Morpheus</title>
  <link rel="preload" href="./public/ui/fonts/cinzel-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./src/ui/styles.css?shadow-progress">
  <link rel="stylesheet" href="./src/ui/tokens.css">
  <link rel="stylesheet" href="./src/ui/ui.css">
  <link rel="stylesheet" href="./src/ui/duel.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body class="is-loading">
  <div id="screen-blackout" aria-hidden="true"></div>
  <section id="loading-screen" aria-label="Loading Morpheus">
    <div class="loading-shaft" aria-hidden="true"></div>
    <div class="loading-content">
      <div class="loading-eclipse" aria-hidden="true"></div>
      <h2 class="mp-text-display loading-title">MORPHEUS</h2>
      <p class="mp-text-caption">A shadow puzzle</p>
      <div class="loading-meter">
        <p class="mp-text-label">Loading</p>
        <div id="loading-progress" role="progressbar" aria-label="Scene loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loading-fill"></div></div>
        <p id="loading-percent">0%</p>
        <p id="loading-status" role="status">Preparing the gallery</p>
        <button id="loading-retry" class="mp-btn" type="button" onclick="location.reload()" hidden>Try again</button>
      </div>
    </div>
    <p class="loading-signature">ENSAM STUDIOS</p>
  </section>
  <div class="mp-game-layer">
  <main id="stage" aria-label="Shadow puzzle"></main>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div>
      <h1 class="mp-text-display">Morpheus</h1><p class="subtitle mp-debug" hidden>Prototype</p>
    </div>
    <div class="actions">
      <button id="reset" title="Reset orientation">Reset</button>
      <button id="pause" aria-pressed="false"><span aria-hidden="true">Ⅱ</span> <span id="pause-label">Pause</span></button>
    </div>
  </header>
  <section class="study" aria-label="Target shadow and match">
    <div class="target-preview">
      <img id="target-reference" alt="Original Shadowmatic fish silhouette" hidden>
      <canvas id="target" role="img" aria-label="Target silhouette projected by Aquafish"></canvas>
    </div>
    <div id="progress-dots" class="progress-dots" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <p id="match-status" class="match-status" role="status"></p>
    <button id="assist" class="solution-button mp-btn mp-btn--quiet" type="button" title="Ease toward the nearest solution" disabled>Assist</button>
    <button id="show-solution" class="solution-button mp-btn mp-btn--quiet" type="button">Show solution</button>
  </section>
  <div id="control-hints" role="status" aria-live="polite"></div>
  <section class="pose-readout mp-debug" aria-label="Object coordinates" hidden>
    <div class="pose-heading"><strong id="pose-name">Object pose</strong><button id="copy-pose" class="mp-btn mp-btn--quiet" type="button">Copy pose</button></div>
    <pre id="pose-values">Loading coordinates...</pre>
    <textarea id="pose-json" aria-label="Pose JSON. Press Control C to copy." readonly hidden></textarea>
  </section>
  <div class="mp-binding-hints" aria-label="Puzzle controls"></div>
  <div id="check-action" hidden></div>
  <details id="mp-authoring" class="mp-panel mp-authoring" hidden>
    <summary class="mp-text-label">Pose authoring</summary>
    <div class="mp-authoring__content">
      <div class="mp-authoring__actions">
        <button id="mp-authoring-copy" class="mp-btn mp-btn--quiet" type="button">Copy current JSON</button>
        <button id="mp-authoring-save" class="mp-btn mp-btn--quiet" type="button">Save current JSON</button>
        <button id="mp-authoring-download" class="mp-btn mp-btn--quiet" type="button" disabled>Download saved JSON</button>
        <button id="mp-authoring-mask" class="mp-btn" type="button">Capture shadow PNG</button>
      </div>
      <p id="mp-authoring-status" class="mp-text-caption" role="status"></p>
      <textarea id="mp-authoring-json" class="mp-text-body" aria-label="Saved pose JSON" readonly></textarea>
    </div>
  </details>
  <div class="telemetry mp-debug" hidden><span id="performance">Measuring FPS…</span></div>
  <span class="mp-sr-only" id="mp-match-announcement" role="status" aria-live="polite"></span>
  </div>
  <section class="mp-main-menu" hidden></section>
  <div hidden><div id="input-settings"></div></div>
  <dialog class="mp-credits" data-mp-reusable="true" aria-labelledby="mp-credits-title">
    <section class="mp-panel mp-credits__content">
      <h2 id="mp-credits-title" class="mp-text-title">Credits</h2>
      <p class="mp-text-body">Morpheus · ENSAM Studios</p>
      <a class="gallery-link mp-text-body" href="./shadowmatic-gallery/gallery.html" target="_blank" rel="noopener">Explore Shadowmatic meshes ↗</a>
      <form method="dialog"><button class="mp-btn" autofocus>Back to puzzle</button></form>
    </section>
  </dialog>
  <div id="error" role="alert" hidden></div>
  <script type="module">
    import('./src/main.js?shadow-progress').catch(error => {
      const notice = document.querySelector('#error');
      notice.hidden = false;
      notice.textContent = `Could not start: ${error.message}`;
      const status=document.querySelector('#loading-status');
      if(status){status.textContent=`Could not load: ${error.message}`;status.setAttribute('role','alert');}
      const retry=document.querySelector('#loading-retry');
      if(retry)retry.hidden=false;
      console.error(error);
    });
  </script>
</body>
</html>
