<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0c0b">
  <link rel="icon" href="data:,">
  <title>Morpheus / Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/ui/styles.css">
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main id="stage" aria-label="Shadow puzzle. Drag to move, R to rotate, Shift-drag to tilt, Z then drag to raise or lower, or scroll to change depth."></main>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div>
      <h1>MORPHEUS</h1><p class="subtitle">PROTOTYPE</p>
      <a class="gallery-link" href="./shadowmatic-gallery/gallery.html" target="_blank" rel="noopener">Explore Shadowmatic meshes <span aria-hidden="true">↗</span></a>
    </div>
    <div class="actions">
      <button id="reset" title="Restore initial object positions and rotations"><span aria-hidden="true">↶</span> Reset</button>
      <button id="pause" aria-pressed="false"><span aria-hidden="true">Ⅱ</span> <span id="pause-label">Pause</span></button>
    </div>
  </header>
  <section class="study" aria-label="Target shadow and match">
    <h2>01 / AQUAFISH</h2>
    <canvas id="target" width="192" height="96" role="img" aria-label="Target silhouette projected by the Aquafish mesh"></canvas>
    <div class="match-row"><span>MATCH</span><strong id="match">—</strong></div>
    <button id="show-solution" class="solution-button">Show solution</button>
  </section>
  <footer><span><kbd>Drag</kbd> Move <b>·</b> <kbd>R</kbd> Rotate <b>·</b> <kbd>Z</kbd> Up / down</span><span class="extra"><kbd>Scroll</kbd> Depth <b>·</b> <kbd>Shift</kbd> + drag Tilt</span></footer>
  <button id="check" class="primary">Check Shadow <span aria-hidden="true">→</span></button>
  <div class="telemetry"><span id="performance">Measuring FPS…</span></div>
  <div id="error" role="alert" hidden></div>
  <script type="module">
    import('./src/main.js').catch(error => {
      const notice = document.querySelector('#error');
      notice.hidden = false;
      notice.textContent = `Could not start: ${error.message}. Run a local HTTP server and check your connection to the Three.js CDN.`;
      console.error(error);
    });
  </script>
</body>
</html>
